<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Login • Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
    }

    :root[data-theme="dark"] {
      --bg-body: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
      --bg-card: #020617;
      --border-subtle: #1f2937;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.12);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --input-bg: #020617;
      --shadow-card: 0 18px 40px rgba(0, 0, 0, 0.85);
    }

    :root[data-theme="light"] {
      --bg-body: radial-gradient(circle at top, #ffffff 0, #f3f4f6 45%, #e5e7eb 100%);
      --bg-card: #ffffff;
      --border-subtle: #d1d5db;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.08);
      --text-main: #111827;
      --text-muted: #4b5563;
      --input-bg: #f9fafb;
      --shadow-card: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      padding: 18px 20px 20px;
    }

    .logo-pill {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #22d3ee, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #020617;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    form {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 13px;
      margin-bottom: 2px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    button {
      margin-top: 4px;
      border-radius: 999px;
      border: 1px solid #16a34a;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #020617;
      width: 100%;
    }

    .error {
      margin-top: 8px;
      font-size: 12px;
      color: #b91c1c;
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      padding: 5px 9px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.05);
      color: var(--text-main);
      cursor: pointer;
    }

    :root[data-theme="dark"] .theme-toggle {
      background: rgba(15, 23, 42, 0.9);
    }
  </style>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button">🌙 Dunkel</button>

  <div class="card">
    <div class="logo-pill">C</div>
    <h1>Login</h1>
    <p>Bitte melde dich an, um den Chatbot zu nutzen.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <!-- WICHTIG: action="/login" + method="post" -->
    <form method="post" action="/login">
      <div>
        <label for="username">Benutzername</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div>
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Anmelden</button>
    </form>

    <div class="hint">
      Standard: Benutzername <code>user</code>, Passwort <code>changeme</code><br />
      Am besten per Umgebungsvariablen <code>APP_USER</code> und <code>APP_PASSWORD</code> ändern.
    </div>
  </div>

  <script>
    // Theme wie auf den anderen Seiten
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById("theme-toggle");

      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        if (theme === "dark") {
          btn.textContent = "☀︎ Hell";
        } else {
          btn.textContent = "🌙 Dunkel";
        }
      }

      function initTheme() {
        const stored = localStorage.getItem("chat_theme");
        if (stored === "dark" || stored === "light") {
          applyTheme(stored);
          return;
        }
        const prefersDark = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark ? "dark" : "light");
      }

      btn.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
        const next = current === "dark" ? "light" : "dark";
        applyTheme(next);
        localStorage.setItem("chat_theme", next);
      });

      initTheme();
    })();
  </script>
</body>
</html>
